name: jp-profiles
# Reads each listed company's latest annual report (and, for five-year operating profit, up to two older ones) into docs/data/jp_profiles/<ticker>.json.
# Only companies whose report changed are read again; the first fill takes several runs.
on:
  schedule:
    - cron: "20 2,11 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: comma-separated tickers to (re)build, empty = everything missing or changed
        default: ""
      debug:
        description: "1 = print revenue-like element names"
        default: ""
      dry:
        description: "1 = print the price block for the tickers and write nothing"
        default: ""
      hldebug:
        description: "1 = with dry, print the text around 最高 when high/low are unreadable"
        default: ""
      owndebug:
        description: "1 = print the rows that look like the holder-category table"
        default: ""
      budget:
        description: minutes of reading per run (default 42)
        default: "42"
permissions:
  contents: write
concurrency:
  group: jp-profiles
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read annual reports
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JP_TICKERS: ${{ inputs.tickers }}
          JP_DEBUG: ${{ inputs.debug }}
          JP_DRY: ${{ inputs.dry }}
          JP_OWNDEBUG: ${{ inputs.owndebug }}
          JP_HLDEBUG: ${{ inputs.hldebug }}
          JP_BUDGET_MIN: ${{ inputs.budget }}
        run: python fetcher/jp_profiles.py
      - name: Commit data
        run: |
          git config user.name "deal-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jp_profiles
          git diff --cached --quiet && exit 0
          git commit -m "jp-profiles: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
