name: edinet-probe
# Manual only. The EDINET key lives in repository secrets, so this is the one place the
# probe can run. It prints filing metadata to the log and writes nothing.
on:
  workflow_dispatch:
    inputs:
      script:
        description: probe script in fetcher/
        default: edinet_probe.py
      tickers:
        description: comma-separated tickers for edinet_probe_yuho.py
        default: "7203,4967,4502,8058"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe EDINET
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          PROBE_TICKERS: ${{ inputs.tickers }}
        run: python fetcher/${{ inputs.script }}
