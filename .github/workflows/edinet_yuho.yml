name: edinet-yuho-index
# Keeps docs/data/edinet_yuho.json (each listed company's latest annual report id plus its older ones in "hist"). The first
# runs walk back about 1,900 days (resumable); after that it only looks at the last few days.
on:
  schedule:
    - cron: "40 1,10 * * 1-5"   # 10:40 and 19:40 JST on weekdays
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-edinet-yuho
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the annual report index
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python fetcher/edinet_yuho.py
      - name: Commit data
        run: |
          git config user.name "deal-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/edinet_yuho.json
          git diff --cached --quiet && exit 0
          git commit -m "edinet-yuho: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
