name: fetch-news
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and tag
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetcher/fetch.py
      - name: Followed stories (list for the follow-up Routine)
        run: python fetcher/follows.py
      - name: Company search list (weekly; Companies page)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetcher/company_index.py
      - name: Commit data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          git config user.name "deal-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add docs/data
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "push/rebase failed (attempt $attempt)"
            git rebase --abort || true
            [ "$attempt" = 3 ] && break
            echo "resetting to origin/main and re-fetching"
            git fetch origin main
            git reset --hard origin/main
            python fetcher/fetch.py
            python fetcher/follows.py
            python fetcher/company_index.py
          done
          echo "giving up after 3 attempts"
          exit 1
