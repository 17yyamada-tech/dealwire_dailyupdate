name: fetch-news
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and tag
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetcher/fetch.py
      - name: Commit data
        run: |
          git config user.name "deal-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
