name: fetch-edinet
# Japanese filings land on JST business days, so this runs a few times a day rather than
# every half hour like the news fetch.
on:
  schedule:
    - cron: "5 1,4,7,10 * * 1-5"   # 10:05, 13:05, 16:05, 19:05 JST on weekdays
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch-edinet
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch EDINET filings
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python fetcher/edinet.py
      - name: Commit data
        run: |
          git config user.name "deal-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/edinet.json fetcher/edinet_codes.json
          git diff --cached --quiet && exit 0
          git commit -m "edinet: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
